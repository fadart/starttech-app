name: Backend CI/CD

on:
  push:
    branches:
      - feature/full-stack
    paths:
      - 'Server/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: starttech-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache-dependency-path: Server/MuchToDo/go.sum

      - name: Install dependencies
        run: go mod download
        working-directory: Server/MuchToDo

      - name: Run unit tests
        run: go test -v ./...
        working-directory: Server/MuchToDo

      - name: Run code quality check
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
        working-directory: Server/MuchToDo

      - name: Run vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: Server/MuchToDo

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            Server/MuchToDo

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/feature/full-stack'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ASG via rolling update
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}'

      - name: Wait for instance refresh to complete
        run: |
          echo "Waiting for instance refresh to complete..."
          for i in {1..30}; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" = "Successful" ]; then
              echo "Instance refresh completed successfully"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Instance refresh failed with status: $STATUS"
              exit 1
            fi
            sleep 30
          done

      - name: Run smoke tests
        run: |
          ALB_URL="${{ secrets.ALB_URL }}"
          if [ -z "$ALB_URL" ]; then
            echo "Error: ALB_URL secret is not set"
            exit 1
          fi
          echo "Running smoke tests against $ALB_URL"
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $ALB_URL/health)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed - health check returned 200"
              exit 0
            fi
            echo "Attempt $i failed with status $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Smoke tests failed"
          exit 1

      - name: Configure CloudWatch monitoring
        run: |
          ALB_SUFFIX=$(echo "${{ secrets.ALB_ARN }}" | sed 's/.*:loadbalancer\///')
          aws cloudwatch put-metric-alarm \
            --alarm-name "starttech-backend-errors" \
            --alarm-description "Backend error rate too high" \
            --metric-name "HTTPCode_Target_5XX_Count" \
            --namespace "AWS/ApplicationELB" \
            --statistic Sum \
            --period 60 \
            --threshold 10 \
            --comparison-operator GreaterThanThreshold \
            --evaluation-periods 2 \
            --dimensions Name=LoadBalancer,Value="$ALB_SUFFIX"

      - name: Notify deployment success
        run: |
          echo "Backend deployed successfully"
          echo "Image tag: ${{ needs.build.outputs.image_tag }}"
          echo "Deployed at: $(date)"
